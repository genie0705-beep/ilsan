<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의전계약서 관리</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">

<link rel="stylesheet" href="contract-doc.css">
<script src="contract-doc.js"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#1B2A2E;--bg:#E9ECEA;--line:#C6CDC9;--soft:#E4E8E6;--celadon:#4F7367;--tint:#EFF3F1;--muted:#6C7873;--r:3px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:14px;padding:20px}
.wrap{max-width:1200px;margin:0 auto}
header.top{display:flex;align-items:baseline;gap:12px;padding:4px 2px 16px}
header.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.06em}
header.top span{font-size:13px;color:var(--muted)}
header.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
input,select{font:inherit;font-size:14px;height:38px;padding:0 10px;background:#FBFCFB;
  border:1px solid var(--line);border-radius:var(--r);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--celadon);outline-offset:-1px;background:#fff}
.btn{font:inherit;font-size:13.5px;height:38px;padding:0 14px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--r)}
.btn.primary{background:var(--celadon);border-color:var(--celadon);color:#fff}
.btn.ghost{color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;border-bottom:1px solid var(--soft)}
.filters .grow{flex:1;min-width:160px}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--soft);white-space:nowrap}
table.list th{font-size:12px;color:var(--muted);font-weight:600;background:var(--tint);position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
table.list tbody tr:hover{background:#F7F9F8}
.tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.tag.wait{border-color:#B4762F;color:#8A5A20}
.tag.ok{border-color:var(--celadon);color:var(--celadon)}
a.pdf{color:var(--celadon);text-decoration:none;font-weight:600}
a.pdf:hover{text-decoration:underline}
.empty{padding:48px;text-align:center;color:var(--muted)}
.login{max-width:360px;margin:12vh auto;padding:26px}
.login h2{margin:0 0 4px;font-size:19px}
.login p{margin:0 0 18px;font-size:13px;color:var(--muted)}
.login .f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.login label{font-size:12px;color:var(--muted)}
.login input{width:100%}
.err{color:#A2402F;font-size:13px;min-height:18px;padding-top:4px}
.sum{display:flex;gap:20px;padding:10px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--soft)}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}

.modal{position:fixed;inset:0;background:rgba(27,42,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal[hidden]{display:none}
.modal .sheet{background:#fff;border-radius:var(--r);width:100%;max-width:760px;padding:22px 26px 28px}
.modal .bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.modal h2{margin:0 0 6px;font-size:20px}
.modal h2 span{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.modal h3{margin:18px 0 6px;font-size:12.5px;color:var(--celadon);letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:4px}
.modal dl{display:grid;grid-template-columns:110px 1fr 110px 1fr;gap:5px 10px;margin:0;font-size:13.5px}
.modal dt{color:var(--muted)}
.modal dd{margin:0}
.modal .bal{margin-top:14px;padding:10px 14px;background:var(--tint);border:1px solid var(--celadon);border-radius:var(--r);font-size:14px}
.modal .bal b{font-size:18px;margin-left:8px}
.modal .muted{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.modal .sigs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal figure{margin:0;border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:center}
.modal figure img{max-width:100%;height:90px;object-fit:contain}
.modal figcaption{font-size:12px;color:var(--muted);margin-top:4px}
@media (max-width:640px){ .modal dl{grid-template-columns:90px 1fr} }
@media print{
  body{background:#fff;padding:0}
  .wrap,.modal .bar{display:none!important}
  .modal{position:static;background:none;padding:0}
  .modal .sheet{max-width:none;padding:0}
}

.modal .sheet{max-width:860px}
.meta-line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.meta-line b{font-size:19px}
.meta-line span{font-size:12.5px;color:var(--muted)}
.docwrap{display:flex;flex-direction:column;gap:16px;align-items:center}
.docwrap .doc{box-shadow:0 1px 6px rgba(27,42,46,.18);transform-origin:top center}
@media (max-width:900px){ .docwrap .doc{transform:scale(.82)} .docwrap{gap:0} }
@media print{
  .wrap,.modal .bar,.meta-line{display:none!important}
  .modal{position:static;background:none;padding:0}
  .modal .sheet{max-width:none;padding:0;box-shadow:none}
  .docwrap{gap:0}
  .docwrap .doc{box-shadow:none;break-after:page}
  .docwrap .doc:last-child{break-after:auto}
}
.btn.danger{border-color:#B4483C;color:#B4483C}
.btn.danger:disabled{border-color:var(--line);color:var(--muted);cursor:default}
th.chk,td.chk{width:38px;text-align:center;padding:9px 6px}
td.chk input,th.chk input{width:17px;height:17px}
</style>
</head>
<body>

<div class="wrap">
  <div id="loginView" class="card login" hidden>
    <h2>의전계약서 관리</h2>
    <p>관리자 계정으로 로그인하세요.</p>
    <div class="f"><label for="email">이메일</label><input type="email" id="email" autocomplete="username"></div>
    <div class="f"><label for="pw">비밀번호</label><input type="password" id="pw" autocomplete="current-password"></div>
    <button class="btn primary" id="btnLogin" style="width:100%;margin-top:6px">로그인</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="mainView" hidden>
    <header class="top">
      <h1>의전계약서</h1><span id="who"></span>
      <div class="right">
        <button class="btn" id="btnCsv">CSV 내려받기</button>
        <button class="btn ghost" id="btnLogout">로그아웃</button>
      </div>
    </header>

    <div class="card">
      <div class="filters">
        <input type="date" id="from" title="시작일">
        <span style="color:var(--muted)">~</span>
        <input type="date" id="to" title="종료일">
        <input type="text" id="q" class="grow" placeholder="고인명 · 상주명 · 담당자 검색">
        <button class="btn" id="btnReload">새로고침</button>
        <button class="btn" id="btnDupe">중복 선택</button>
        <button class="btn danger" id="btnDelete" disabled>선택 삭제</button>
      </div>
      <div style="overflow:auto;max-height:70vh">
        <table class="list">
          <thead><tr>
            <th class="chk"><input type="checkbox" id="checkAll" aria-label="전체 선택"></th>
            <th>접수일자</th><th>고인명</th><th>상주명</th><th>연락처</th>
            <th>장례식장</th><th>담당자</th><th class="num">총 잔여금액</th>
            <th>서명일시</th><th>계약서</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>해당 조건의 계약서가 없습니다.</div>
      </div>
      <div class="sum">
        <span>건수 <b id="cnt">0</b></span>
        <span>총 잔여금액 합계 <b id="sumAmt">0</b>원</span>
      </div>
    </div>
  </div>
</div>


<div id="detail" class="modal" hidden>
  <div class="sheet">
    <div class="bar">
      <button class="btn" id="detailPrint">인쇄</button>
      <button class="btn ghost" id="detailClose">닫기</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, getDocs, doc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARil-QDNDRF0jP9pmd9d-kjr17akuWs_o",
  authDomain: "ilsan-3ec79.firebaseapp.com",
  projectId: "ilsan-3ec79",
  storageBucket: "ilsan-3ec79.firebasestorage.app",
  messagingSenderId: "1028059171132",
  appId: "1:1028059171132:web:104cb67189de7778f87639"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
let all = [];

onAuthStateChanged(auth, u => {
  const logged = !!u && !u.isAnonymous;
  $("#loginView").hidden = logged;
  $("#mainView").hidden = !logged;
  if (logged){ $("#who").textContent = u.email; load(); }
});

$("#btnLogin").addEventListener("click", async () => {
  $("#loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#pw").value); }
  catch (e){ $("#loginErr").textContent = "로그인에 실패했습니다. 계정을 확인해 주세요."; }
});
$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#btnLogin").click(); });
$("#btnLogout").addEventListener("click", () => signOut(auth));
$("#btnReload").addEventListener("click", load);
["#from","#to","#q"].forEach(sel => $(sel).addEventListener("input", render));

const fmt = n => (Number(n) || 0).toLocaleString("ko-KR");

async function load(){
  const snap = await getDocs(query(collection(db, "contracts"), orderBy("receiptDate", "desc"), limit(500)));
  all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}

function filtered(){
  const from = $("#from").value, to = $("#to").value;
  const q = $("#q").value.trim().toLowerCase();
  return all.filter(r => {
    const d = r.receiptDate || "";
    if (from && d < from) return false;
    if (to && d > to) return false;
    if (q){
      const hay = [r.deceasedName, r.chiefName, r.staff, r.conductor, r.place].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const rows = filtered();
  $("#rows").innerHTML = rows.map(r => `
    <tr>
      <td class="chk"><input type="checkbox" class="pick" value="${r.id}" aria-label="선택"></td>
      <td>${r.receiptDate || "—"}</td>
      <td><b>${r.deceasedName || "—"}</b></td>
      <td>${r.chiefName || "—"}</td>
      <td>${r.telMobile || "—"}</td>
      <td>${r.place || "—"}</td>
      <td>${r.staff || r.conductor || "—"}</td>
      <td class="num">${fmt(r.balance)}원</td>
      <td>${r.signedAt || "—"}</td>
      <td><a class="pdf" href="#" data-view="${r.id}">보기</a></td>
    </tr>`).join("");
  $("#empty").hidden = rows.length > 0;
  $("#cnt").textContent = rows.length;
  if ($("#checkAll")) $("#checkAll").checked = false;
  if (typeof syncDelete === "function") syncDelete();
  $("#sumAmt").textContent = fmt(rows.reduce((a, r) => a + (Number(r.balance) || 0), 0));
}

/* 계약 상세 보기 — 고객이 받는 계약서·영수증과 같은 문서로 표시 */
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function showDetail(r){
  const p = r.payload || {};
  const get = name => {
    const v = p[name];
    return v === undefined || v === null ? "" : String(v);
  };
  $("#detailBody").innerHTML = `
    <div class="meta-line">
      <b>${esc(r.deceasedName || "—")}</b>
      <span>접수 ${esc(r.receiptDate || "—")} · 담당 ${esc(r.staff || r.conductor || "—")}
            · 서명일시 ${esc(r.signedAt || "—")} · 문서번호 ${esc(r.id)}</span>
    </div>
    ${r.pdfUrl ? `<p><a class="pdf" href="${r.pdfUrl}" target="_blank" rel="noopener">저장된 PDF 열기 (이전 기록)</a></p>` : ""}
    ${!r.pdfUrl && r.pdfChunks ? `<p><a class="pdf" href="#" data-pdf="${r.id}">저장된 PDF 열기 (이전 기록)</a></p>` : ""}
    <div class="docwrap">
      <div id="viewContract" class="doc"></div>
      <div id="viewReceipt" class="doc receipt"></div>
    </div>`;
  fillContract(document.getElementById("viewContract"), get);
  fillReceiptDoc(document.getElementById("viewReceipt"), get);
  $("#detail").hidden = false;
}

$("#rows").addEventListener("click", e => {
  const a = e.target.closest("[data-view]"); if (!a) return;
  e.preventDefault();
  const r = all.find(x => x.id === a.dataset.view);
  if (r) showDetail(r);
});
/* 이전 버전에서 Firestore에 분할 저장된 PDF 복원 */
$("#detailBody").addEventListener("click", async e => {
  const a = e.target.closest("[data-pdf]"); if (!a) return;
  e.preventDefault();
  const keep = a.textContent; a.textContent = "불러오는 중…";
  try {
    const snap = await getDocs(collection(db, "contractPdfs", a.dataset.pdf, "chunks"));
    const b64 = snap.docs.sort((x, y) => x.id.localeCompare(y.id)).map(d => d.data().data).join("");
    const bin = atob(b64), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([buf], { type: "application/pdf" }));
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err){ console.error(err); alert("저장된 PDF를 불러오지 못했습니다."); }
  finally { a.textContent = keep; }
});
$("#detailClose").addEventListener("click", () => { $("#detail").hidden = true; });
$("#detailPrint").addEventListener("click", () => window.print());
$("#detail").addEventListener("click", e => { if (e.target.id === "detail") $("#detail").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#detail").hidden = true; });

/* ── 선택 · 중복 정리 · 삭제 ── */
const picked = () => Array.from(document.querySelectorAll(".pick:checked")).map(e => e.value);
function syncDelete(){
  const n = picked().length;
  $("#btnDelete").disabled = n === 0;
  $("#btnDelete").textContent = n ? `선택 삭제 (${n})` : "선택 삭제";
}
$("#rows").addEventListener("change", e => { if (e.target.classList.contains("pick")) syncDelete(); });
$("#checkAll").addEventListener("change", e => {
  document.querySelectorAll(".pick").forEach(c => { c.checked = e.target.checked; });
  syncDelete();
});

/* 같은 내용이 여러 건이면 가장 오래된 1건만 남기고 나머지를 선택 */
$("#btnDupe").addEventListener("click", () => {
  const seen = new Map();
  const dupes = [];
  filtered().slice().sort((a, b) => String(a.id).localeCompare(String(b.id))).forEach(r => {
    const key = [r.deceasedName, r.chiefName, r.receiptDate, r.balance, r.signedAt, r.place].join("|");
    if (seen.has(key)) dupes.push(r.id); else seen.set(key, r.id);
  });
  document.querySelectorAll(".pick").forEach(c => { c.checked = dupes.includes(c.value); });
  $("#checkAll").checked = false;
  syncDelete();
  alert(dupes.length
    ? `중복 ${dupes.length}건을 선택했습니다. 각 내용의 가장 먼저 저장된 1건은 남겨 두었습니다.\n확인 후 '선택 삭제'를 누르세요.`
    : "중복된 계약서가 없습니다.");
});

$("#btnDelete").addEventListener("click", async () => {
  const ids = picked();
  if (!ids.length) return;
  const names = ids.slice(0, 5).map(id => {
    const r = all.find(x => x.id === id);
    return `· ${r ? (r.deceasedName || "—") + " / " + (r.receiptDate || "") : id}`;
  }).join("\n");
  if (!confirm(`계약서 ${ids.length}건을 삭제합니다. 되돌릴 수 없습니다.\n\n${names}${ids.length > 5 ? "\n…" : ""}`)) return;

  const btn = $("#btnDelete"); btn.disabled = true; btn.textContent = "삭제 중…";
  let ok = 0, fail = 0;
  for (const id of ids){
    try { await deleteDoc(doc(db, "contracts", id)); ok++; }
    catch (e){ console.error(id, e); fail++; }
  }
  if (fail) { await load(); }                  // 실패가 있으면 서버에서 다시 읽어 맞춤
  else { all = all.filter(r => !ids.includes(r.id)); render(); }
  syncDelete();
  alert(fail ? `${ok}건 삭제, ${fail}건 실패했습니다.` : `${ok}건을 삭제했습니다.`);
});

$("#btnCsv").addEventListener("click", () => {
  const rows = filtered();
  const head = ["접수일자","고인명","상주명","연락처","장례식장","담당자","총잔여금액","서명일시","문서번호"];
  const body = rows.map(r => [r.receiptDate, r.deceasedName, r.chiefName, r.telMobile,
    r.place, r.staff || r.conductor, r.balance, r.signedAt, r.id]);
  const csv = "\uFEFF" + [head, ...body]
    .map(line => line.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `의전계약서_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
